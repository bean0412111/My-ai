<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My AI">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>My AI</title>
</head>
<body>
  <div class="app">
    <header>
      <button id="newChat" class="icon" aria-label="New chat">＋</button>
      <div class="title">My AI</div>
      <button id="settingsBtn" class="icon" aria-label="Settings">⚙</button>
    </header>

    <main id="chat" aria-live="polite">
      <section id="welcome" class="welcome">
        <h1>My AI</h1>
        <p>Your private assistant interface.</p>
        <p class="muted">The starter version works offline and saves chats locally on this device.</p>
      </section>
    </main>

    <form id="composer">
      <textarea id="input" rows="1" placeholder="Message My AI…" autocomplete="off"></textarea>
      <button id="send" type="submit" aria-label="Send">↑</button>
    </form>
  </div>

  <dialog id="settings">
    <div class="dialog-head">
      <h2>Settings</h2>
      <button id="closeSettings" class="icon">×</button>
    </div>
    <label>
      AI instructions
      <textarea id="systemPrompt" rows="7"></textarea>
    </label>
    <p class="muted small">This starter stores the instructions and chats in this browser. No AI model is bundled yet.</p>
    <button id="saveSettings" class="primary">Save</button>
    <button id="clearData" class="danger">Delete local chats & settings</button>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
